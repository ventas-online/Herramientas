<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca de diseño · Catálogo IA</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f3f6;color:#211d22}.app{max-width:1250px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{background:white;border:1px solid #e6dfe6;border-radius:18px;padding:14px;box-shadow:0 8px 25px #0000000b}.preview{height:260px;border-radius:13px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.preview h2{margin:0;font-size:25px}.preview p{margin:4px 0}.products{display:grid;grid-template-columns:1fr 1fr;gap:8px}.products i{height:70px;border-radius:8px;background:#ffffffaa;display:block}.pastel{background:linear-gradient(145deg,#fde9f1,#fff)}.luxury{background:linear-gradient(145deg,#1e1a1e,#4b3e48);color:white}.minimal{background:#fff;border:1px solid #eee}.commercial{background:linear-gradient(145deg,#f7eee2,#ead7bf)}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;background:#c83f77;color:#fff;cursor:pointer;width:100%;margin-top:10px}.tag{font-size:11px;font-weight:800;opacity:.7}.hero{background:#fff;border-radius:20px;padding:22px;margin-bottom:20px}.hero h1{margin:0 0 7px}@media(max-width:650px){.app{padding:14px}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="app"><section class="hero"><h1>🎨 Biblioteca de plantillas</h1><p>Diseños especializados para catálogos comerciales. Elige una estructura y después personalízala en el editor.</p></section><section class="grid"><article class="card"><div class="preview pastel"><span class="tag">PASTEL BEAUTY</span><h2>Tu marca, tus productos.</h2><div class="products"><i></i><i></i><i></i><i></i></div></div><button onclick=
