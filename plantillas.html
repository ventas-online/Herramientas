<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Galería visual de plantillas para crear catálogos profesionales.">
<title>Plantillas · Herramientas IA</title>
<style>
:root{--bg:#f6f4f8;--panel:#fff;--ink:#201b24;--muted:#746b76;--line:#e7e0e9;--accent:#c83f77;--accent2:#8b5cf6;--soft:#fff0f6;--shadow:0 12px 34px rgba(36,24,42,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{max-width:1500px;margin:auto;padding:18px 22px 32px}.top{display:flex;align-items:center;gap:18px;justify-content:space-between;margin-bottom:18px}.brand{font-size:22px;font-weight:950;letter-spacing:-.5px}.brand span{color:var(--accent)}.top-actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:10px 14px;font-weight:850;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px #25172d14}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:6px 0 20px}.hero h1{font-size:clamp(28px,4vw,44px);line-height:1;margin:0 0 9px;letter-spacing:-1.5px}.hero p{margin:0;color:var(--muted);max-width:690px;line-height:1.55}.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:0 13px;min-width:280px;box-shadow:0 5px 18px #281a3210}.search input{border:0;outline:0;background:transparent;padding:12px 4px;width:100%}
.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 16px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:850;cursor:pointer;white-space:nowrap}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:18px;align-items:start}.gallery{background:transparent}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.template-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:0 8px 25px #2d1d3810;cursor:pointer;transition:.24s;position:relative}.template-card:hover{transform:translateY(-5px);box-shadow:0 18px 36px #2d1d3820}.template-card.active{border:2px solid var(--accent);padding:8px;box-shadow:0 16px 38px #c83f7730}.preview{aspect-ratio:3/4;position:relative;overflow:hidden;border-radius:15px;background:#eee}.preview:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#fff0 55%,#fff4 100%);pointer-events:none}.card-info{display:flex;justify-content:space-between;align-items:center;padding:9px 4px 3px;gap:8px}.card-info b{font-size:14px}.count{font-size:11px;color:var(--muted);white-space:nowrap}.use{width:100%;margin-top:8px;border:0;border-radius:11px;padding:9px;background:#f7f2f6;font-weight:850;cursor:pointer}.template-card.active .use{background:var(--accent);color:#fff}
/* Mini catalog designs */
.cover-mini{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column}.cover-mini .mini-brand{font-size:8px;letter-spacing:1.4px;font-weight:900;text-transform:uppercase;opacity:.72}.cover-mini h3{font-size:27px;line-height:.93;margin:10px 0 6px;letter-spacing:-1.3px}.cover-mini p{font-size:8px;line-height:1.35;margin:0;max-width:85%;opacity:.72}.mini-img{position:absolute;overflow:hidden;border-radius:12px}.mini-img img{width:100%;height:100%;object-fit:cover}.mini-grid{position:absolute;left:15px;right:15px;bottom:15px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.mini-product{background:#fff;border-radius:10px;padding:5px;box-shadow:0 4px 12px #0001}.mini-product .pic{height:68px;border-radius:7px;background:#f4eef2;overflow:hidden}.mini-product img{width:100%;height:100%;object-fit:cover}.mini-product strong{display:block;font-size:7px;margin-top:4px}.mini-product em{display:block;font-size:7px;font-style:normal;font-weight:900;margin-top:2px}
.pink{background:linear-gradient(150deg,#ffd6e6,#ff91ba 58%,#f56a9d);color:#5d1634}.pink .mini-img{width:58%;height:46%;right:0;top:0;border-radius:0 0 0 70px}.pink .mini-img img{filter:saturate(1.12)}.pink .mini-grid{display:none}.pink .hero-word{font-size:39px;font-weight:1000;letter-spacing:-2px;margin-top:auto;margin-bottom:30px}
.bold{background:#f4f0ec;color:#171717}.bold .mini-img{left:13px;right:13px;top:13px;height:48%}.bold .mini-img img{filter:grayscale(.35)}.bold .cover-mini{padding-top:0}.bold .copy{position:absolute;left:20px;right:20px;bottom:30px}.bold h3{font-size:30px;text-transform:uppercase;font-weight:1000}.bold .stripe{position:absolute;right:0;top:0;width:28%;height:100%;background:#181818;mix-blend-mode:multiply;opacity:.08}
.lux{background:linear-gradient(145deg,#17131a,#3a2736);color:#fff}.lux .mini-img{width:62%;height:43%;right:0;top:0;border-radius:0 0 0 80px}.lux .mini-img img{filter:contrast(1.05) saturate(.7)}.lux .goldline{height:2px;width:80px;background:#d9b77b;margin:9px 0}.lux .mini-grid{bottom:14px}.lux .mini-product{background:#2c2029;color:#fff;border:1px solid #ffffff1f}.lux .mini-product .pic{background:#41303b}
.clean{background:#fff;color:#25222a}.clean .mini-brand{color:#8b5cf6}.clean .cover-mini h3{font-size:28px}.clean .mini-img{left:16px;right:16px;top:115px;height:35%;border-radius:15px}.clean .mini-grid{bottom:14px}.clean .mini-product{border:1px solid #eee;box-shadow:none}.clean .mini-product .pic{height:60px}
.boutique{background:linear-gradient(180deg,#fff9f3,#f9e5d6);color:#6b4031}.boutique .arch{position:absolute;right:0;top:0;width:47%;height:54%;border-radius:0 0 0 100%;background:#efbda4}.boutique .mini-img{right:16px;top:35px;width:42%;height:38%;border-radius:70px 70px 8px 8px}.boutique .mini-grid{bottom:15px}.boutique .mini-product{background:#fffaf6}.boutique .mini-product .pic{height:57px}
.fresh{background:linear-gradient(145deg,#e8fff6,#c9f4e5);color:#125c4a}.fresh .circle{position:absolute;width:180px;height:180px;right:-55px;top:-45px;border-radius:50%;background:#55cba5}.fresh .mini-img{left:16px;top:98px;width:47%;height:37%;border-radius:60px 12px 12px 12px}.fresh .mini-grid{grid-template-columns:repeat(2,1fr);bottom:13px}.fresh .mini-product .pic{height:55px}
.neon{background:#15151b;color:#fff}.neon .blob{position:absolute;width:180px;height:180px;border-radius:45% 55% 60% 40%;right:-45px;top:-30px;background:linear-gradient(135deg,#ff3cac,#784ba0)}.neon .mini-img{left:15px;right:15px;top:115px;height:38%;border-radius:14px}.neon .mini-grid{bottom:13px}.neon .mini-product{background:#24242d;color:#fff}.neon .mini-product .pic{background:#33333d}
.classic{background:#f6f0e5;color:#4b3b2b}.classic .frame{position:absolute;inset:11px;border:1px solid #a98d67;border-radius:8px}.classic .mini-img{left:25px;right:25px;top:88px;height:34%;border-radius:5px}.classic .mini-grid{bottom:22px}.classic .mini-product{border:1px solid #ddcfb8;background:#fbf7ef}.classic .mini-product .pic{height:52px;background:#eee5d4}
/* Editor / live canvas */
.editor{position:sticky;top:15px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow)}.editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.editor-head h2{font-size:17px;margin:0}.status-pill{font-size:11px;font-weight:900;padding:7px 9px;border-radius:999px;background:#edf9f2;color:#247348}.canvas-wrap{background:#ddd8df;border-radius:16px;padding:14px;max-height:650px;overflow:auto}.canvas{width:min(100%,390px);min-height:520px;margin:auto;background:#fff;position:relative;overflow:hidden;box-shadow:0 14px 30px #0002;border-radius:7px;padding:28px 24px}.canvas.pastel{background:linear-gradient(180deg,#fff2f7,#fff)}.canvas.luxury{background:linear-gradient(145deg,#17131a,#33202d);color:#fff}.canvas.minimal{background:#fff}.canvas.commercial{background:#f7f0e8}.canvas.fresh{background:linear-gradient(145deg,#effff9,#d8f7ec)}.canvas.neon{background:#15151b;color:#fff}.canvas.boutique{background:#fff7f0}.canvas.classic{background:#f6f0e5}.canvas h1{font-size:34px;line-height:.98;margin:7px 0}.canvas .eyebrow{font-size:8px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}.canvas .slogan{font-size:11px;opacity:.72;margin:0;max-width:90%}.canvas-cover-img{height:155px;border-radius:15px;overflow:hidden;margin:18px 0 12px;background:#f0e9ee}.canvas-cover-img img{width:100%;height:100%;object-fit:cover}.canvas-products{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px}.canvas-product{background:#fff;border:1px solid #eee;border-radius:12px;padding:7px;color:#211c24}.canvas.luxury .canvas-product,.canvas.neon .canvas-product{background:#ffffff12;border-color:#ffffff20;color:#fff}.canvas-product .cp-img{height:100px;border-radius:8px;overflow:hidden;background:#f3edf1}.canvas-product img{width:100%;height:100%;object-fit:cover}.canvas-product b{display:block;font-size:9px;margin-top:5px}.canvas-product span{display:block;font-size:9px;font-weight:950;margin-top:3px;color:var(--accent)}.canvas.luxury .canvas-product span,.canvas.neon .canvas-product span{color:#f3c2d7}.canvas-empty{font-size:11px;color:var(--muted);padding:20px 0}.controls{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.control{margin:10px 0}.control label{display:block;font-size:11px;font-weight:900;margin-bottom:5px}.control input,.control select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none;background:#fff}.control input:focus,.control select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #c83f7715}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editor-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.editor-actions .btn:last-child{grid-column:1/-1;background:var(--accent);color:#fff;border-color:var(--accent)}
.no-results{display:none;background:#fff;border:1px dashed var(--line);padding:30px;border-radius:18px;text-align:center;color:var(--muted)}
@media(max-width:1180px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{grid-template-columns:minmax(0,1fr) 360px}}
@media(max-width:900px){.hero{align-items:stretch;flex-direction:column}.search{min-width:0;width:100%}.workspace{grid-template-columns:1fr}.editor{position:relative;top:auto}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.app{padding:13px}.top{align-items:flex-start;flex-direction:column}.gallery-grid{grid-template-columns:1fr 1fr;gap:10px}.template-card{border-radius:15px;padding:7px}.template-card.active{padding:6px}.preview{border-radius:11px}.cover-mini{padding:11px}.cover-mini h3{font-size:21px}.card-info{display:block}.count{display:block;margin-top:3px}.use{font-size:11px;padding:8px}.canvas{min-height:480px;padding:24px 18px}.editor-actions{grid-template-columns:1fr}.editor-actions .btn:last-child{grid-column:auto}}
/* Solo imprime el catálogo, no la interfaz de la herramienta */
@media print{body{background:#fff}.app>.top,.app>.hero,.filters,.workspace>.gallery,.editor-head,.controls,.editor-actions{display:none!important}.app{padding:0;max-width:none}.workspace{display:block}.editor{border:0;box-shadow:none;padding:0}.canvas-wrap{padding:0;background:#fff;max-height:none;overflow:visible}.canvas{width:100%;max-width:760px;min-height:1050px;border-radius:0;box-shadow:none;margin:0 auto;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">🛍️ Catálogo<span> IA</span></div>
  <div class="top-actions"><button class="btn" onclick="location.href='index.html'">← Productos</button><button class="btn primary" onclick="printCatalog()">PDF / Imprimir</button></div>
</header>
<section class="hero">
  <div><h1>Plantillas que se ven vivas.</h1><p>Elige un diseño visual, pruébalo con las fotos reales del cliente y entrégale un catálogo que parezca hecho por un diseñador, no una página genérica.</p></div>
  <div class="search">🔎 <input id="search" placeholder="Buscar plantillas..." autocomplete="off"></div>
</section>
<div class="filters" id="filters"><button class="chip active" data-filter="all">✨ Todas</button><button class="chip" data-filter="beauty">💄 Belleza</button><button class="chip" data-filter="store">🛍️ Tienda</button><button class="chip" data-filter="premium">💎 Premium</button><button class="chip" data-filter="food">🍰 Alimentos</button><button class="chip" data-filter="promo">🔥 Promocional</button></div>
<div class="workspace">
<section class="gallery">
<div class="gallery-grid" id="gallery"></div>
<div class="no-results" id="noResults">No encontramos una plantilla con ese nombre.</div>
</section>
<aside class="editor">
  <div class="editor-head"><h2>Vista previa en vivo</h2><span class="status-pill" id="selectedName">Pastel Beauty</span></div>
  <div class="canvas-wrap"><section id="canvas" class="canvas pastel"></section></div>
  <div class="controls">
    <div class="two"><div class="control"><label>Nombre del negocio</label><input id="title" placeholder="Mi negocio"></div><div class="control"><label>Eslogan</label><input id="sub" placeholder="Productos para ti"></div></div>
    <div class="two"><div class="control"><label>Mostrar precios</label><select id="showPrices"><option value="yes">Sí</option><option value="no">No</option></select></div><div class="control"><label>Columnas</label><select id="columns"><option value="2">2 productos</option><option value="1">1 producto</option></select></div></div>
    <div class="control"><label>Color de acento</label><input id="accent" type="color" value="#c83f77" style="height:40px;padding:4px"></div>
  </div>
  <div class="editor-actions"><button class="btn" onclick="scrollToGallery()">🎨 Cambiar plantilla</button><button class="btn" onclick="resetEditor()">↺ Restablecer</button><button class="btn" onclick="printCatalog()">✨ Usar plantilla y exportar PDF</button></div>
</aside>
</div>
</div>
<script>
const saved=JSON.parse(localStorage.getItem('catalogoCliente')||'null');
const client=saved?.client||{};const products=(saved?.products||[]).slice(0,6);
const catalogTemplates=[
{id:'pastel',name:'Pink Editorial',categories:['beauty','promo'],tags:'Belleza · Femenino',cls:'pink',count:'12 páginas',title:'ALTA PINTA',eyebrow:'MAKEUP COLLECTION',desc:'Colecciones que llaman la atención',hero:true},
{id:'bold',name:'Bold Studio',categories:['store','promo'],tags:'Moderna · Impacto',cls:'bold',count:'8 páginas',title:'CATÁLOGO DE PRODUCTOS',eyebrow:'NUEVA COLECCIÓN',desc:'Diseño fuerte y directo'},
{id:'clean',name:'Clean Boutique',categories:['beauty','store'],tags:'Limpia · Elegante',cls:'clean',count:'10 páginas',title:'Mis preferidos',eyebrow:'SELECCIÓN ESPECIAL',desc:'Minimalismo con producto protagonista'},
{id:'luxury',name:'Luxury Black',categories:['premium','beauty'],tags:'Premium · Lujo',cls:'lux',count:'14 páginas',title:'THE COLLECTION',eyebrow:'PREMIUM EDITION',desc:'Una presencia oscura y sofisticada'},
{id:'boutique',name:'Soft Boutique',categories:['beauty','store'],tags:'Suave · Boutique',cls:'boutique',count:'9 páginas',title:'NUEVA COLECCIÓN',eyebrow:'BOUTIQUE',desc:'Cálida, femenina y comercial'},
{id:'fresh',name:'Fresh Market',categories:['food','store'],tags:'Fresco · Natural',cls:'fresh',count:'7 páginas',title:'LO NATURAL',eyebrow:'SELECCIÓN FRESCA',desc:'Color y energía para productos'},
{id:'neon',name:'Neon Promo',categories:['promo','store'],tags:'Oferta · Viral',cls:'neon',count:'6 páginas',title:'OFERTAS HOY',eyebrow:'PROMO DROP',desc:'Diseño pensado para vender rápido'},
{id:'classic',name:'Classic Cream',categories:['food','premium'],tags:'Clásica · Artesanal',cls:'classic',count:'8 páginas',title:'NUESTRO CATÁLOGO',eyebrow:'HECHO CON CUIDADO',desc:'Estética artesanal y de confianza'}
];
let selected='pastel',activeFilter='all';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imgAt(i){return products[i]?.image||''}
function miniProducts(){return products.slice(0,4).map((p,i)=>`<div class="mini-product"><div class="pic">${imgAt(i)?`<img src="${imgAt(i)}" alt="">`:''}</div><strong>${esc(p.nombre||'Producto '+(i+1))}</strong><em>${esc(p.precio||'Consultar')}</em></div>`).join('')}
function previewHTML(t,small=false){const first=imgAt(0);if(small){let extra='';if(t.id==='pink')extra='<div class="hero-word">BEAUTY</div>';if(t.id==='bold')extra='<div class="copy"></div><div class="stripe"></div>';if(t.id==='luxury')extra='<div class="goldline"></div>';if(t.id==='boutique')extra='<div class="arch"></div>';if(t.id==='fresh')extra='<div class="circle"></div>';if(t.id==='neon')extra='<div class="blob"></div>';if(t.id==='classic')extra='<div class="frame"></div>';return `<div class="cover-mini ${t.cls}"><div class="mini-brand">${esc(t.eyebrow)}</div><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p>${extra}${first?`<div class="mini-img"><img src="${first}" alt=""></div>`:''}${t.id!=='pink'&&t.id!=='bold'?`<div class="mini-grid">${miniProducts()}</div>`:''}</div>`}
return `<div class="eyebrow">${esc(t.eyebrow)}</div><h1 id="liveTitle">${esc($('title').value||client.business||t.title)}</h1><p class="slogan" id="liveSub">${esc($('sub').value||client.slogan||t.desc)}</p>${first?`<div class="canvas-cover-img"><img src="${first}" alt=""></div>`:''}<div class="canvas-products" id="liveProducts" style="grid-template-columns:repeat(${$('columns').value},1fr)">${products.length?products.map((p,i)=>`<article class="canvas-product"><div class="cp-img">${p.image?`<img src="${p.image}" alt="">`:''}</div><b>${esc(p.nombre||'Producto '+(i+1))}</b>${$('showPrices').value==='yes'?`<span>${esc(p.precio||'Consultar')}</span>`:''}</article>`).join(''):'<div class="canvas-empty">Agrega fotos desde Productos para verlas aquí.</div>'}</div>`}
function renderGallery(){const q=($('search').value||'').toLowerCase().trim();const list=catalogTemplates.filter(t=>(activeFilter==='all'||t.categories.includes(activeFilter))&&(!q||`${t.name} ${t.tags} ${t.desc}`.toLowerCase().includes(q)));$('gallery').innerHTML=list.map(t=>`<article class="template-card ${t.id===selected?'active':''}" data-id="${t.id}"><div class="preview">${previewHTML(t,true)}</div><div class="card-info"><b>${t.name}</b><span class="count">${t.count}</span></div><div class="count">${t.tags}</div><button class="use" type="button">${t.id===selected?'✓ Seleccionada':'Usar esta plantilla'}</button></article>`).join('');$('noResults').style.display=list.length?'none':'block';document.querySelectorAll('.template-card').forEach(card=>{card.onclick=()=>selectTemplate(card.dataset.id);card.querySelector('.use').onclick=e=>{e.stopPropagation();selectTemplate(card.dataset.id);scrollToEditor()}})}
function selectTemplate(id){selected=id;const t=catalogTemplates.find(x=>x.id===id)||catalogTemplates[0];$('canvas').className='canvas '+t.cls;$('selectedName').textContent=t.name;$('canvas').innerHTML=previewHTML(t,false);renderGallery();}
function bind(){['title','sub','showPrices','columns','accent'].forEach(id=>$(id).addEventListener('input',renderLive));$('search').addEventListener('input',renderGallery);document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{activeFilter=x.dataset.filter;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===x));renderGallery()})}
function renderLive(){const t=catalogTemplates.find(x=>x.id===selected)||catalogTemplates[0];$('canvas').innerHTML=previewHTML(t,false);$('canvas').style.setProperty('--accent',$('accent').value)}
function loadSaved(){ $('title').value=client.business||'';$('sub').value=client.slogan||''; if(client.style){const map={'Pastel':'pastel','Elegante':'clean','Minimalista':'clean','Premium':'luxury','Comercial':'bold'};if(map[client.style])selected=map[client.style]} }
function resetEditor(){ $('title').value=client.business||'';$('sub').value=client.slogan||'';$('showPrices').value='yes';$('columns').value='2';$('accent').value='#c83f77';renderLive() }
function printCatalog(){renderLive();setTimeout(()=>window.print(),80)}
function scrollToEditor(){document.querySelector('.editor').scrollIntoView({behavior:'smooth',block:'start'})}
function scrollToGallery(){document.querySelector('.gallery').scrollIntoView({behavior:'smooth',block:'start'})}
loadSaved();bind();selectTemplate(selected);
</script>
</body>
</html>
