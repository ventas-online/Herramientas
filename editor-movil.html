<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17141d"><title>Editor móvil de catálogos</title><style>
:root{--f:#c83f77;--ink:#17141d;--bg:#eeeaf0;--card:#fff;--muted:#756d7a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}.top{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 10px;position:sticky;top:0;z-index:20}.top b{font-size:15px}.top button,.miniBtn{border:0;background:#f3f0f4;border-radius:10px;padding:9px 11px;font-weight:800}.top .primary{background:var(--ink);color:#fff}.workspace{min-height:calc(100vh - 58px);padding:10px 10px 92px}.canvasWrap{max-width:520px;margin:auto}.pages{display:flex;gap:6px;overflow:auto;padding:2px 0 9px;scrollbar-width:none}.thumb{min-width:56px;height:70px;border:2px solid #ddd;border-radius:9px;background:#fff;font-size:9px;font-weight:800}.thumb.active{border-color:var(--f);box-shadow:0 0 0 2px #c83f7722}.page{position:relative;width:100%;min-height:680px;background:#fff;border-radius:18px;padding:18px;box-shadow:0 16px 45px #0002;overflow:hidden;transition:.25s;touch-action:pan-y}.page.turn{animation:turn .32s}@keyframes turn{from{transform:rotateY(-7deg);opacity:.4}to{transform:none;opacity:1}}.theme-suave{background:linear-gradient(145deg,#fff0f6,#fff)}.theme-elegante{background:linear-gradient(145deg,#211920,#3b2933);color:#fff}.theme-editorial{background:#f2e9de}.theme-minimalista{background:#fff}.theme-boutique{background:#fff0e7}.theme-natural{background:#eafff6}.theme-juvenil{background:linear-gradient(145deg,#1d1720,#492d50);color:#fff}.theme-clasica{background:#eee2cd}.cover{min-height:330px;border-radius:22px;padding:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.cover h1{font-size:42px;line-height:.95;max-width:62%;margin:8px 0}.cover p{max-width:55%;font-size:13px}.cover img{position:absolute;right:0;top:0;width:48%;height:100%;object-fit:cover;border-radius:90px 0 0 90px}.theme-suave .cover{background:#f8b7d0}.theme-elegante .cover{background:#2d2027}.theme-editorial .cover{background:#d9c9b7}.theme-minimalista .cover{background:#f0eef2}.theme-boutique .cover{background:#e6c2ae}.theme-natural .cover{background:#bce4d3}.theme-juvenil .cover{background:#57335d}.theme-clasica .cover{background:#ddceb4}.block{margin:14px 0}.block.selected{outline:2px solid var(--f);outline-offset:4px;border-radius:12px}.photo{width:100%;height:220px;object-fit:cover;border-radius:14px;background:#ddd}.product{background:#fff;color:#222;border-radius:16px;padding:9px;border:1px solid #e6e1e6}.product img{width:100%;height:210px;object-fit:cover;border-radius:11px}.product h3{margin:9px 2px 5px;font-size:16px}.product p{margin:0 2px;color:#777;font-size:12px}.price{font-weight:950;font-size:18px;color:var(--f);margin:8px 2px}.offer{padding:22px;border-radius:17px;background:var(--f);color:#fff}.wa{padding:13px;border-radius:12px;background:#e9f7ef;color:#237345;text-align:center;font-weight:900}.addbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));z-index:30}.addmain{width:100%;background:var(--ink);color:#fff;border:0;border-radius:15px;padding:13px;font-weight:950;font-size:15px}.addmenu{display:none;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}.addmenu.open{display:grid}.addmenu button{border:1px solid #e5dfe6;background:#faf8fa;border-radius:12px;padding:10px 4px;font-size:11px;font-weight:850}.sheet{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:50}.sheet.open{display:flex}.sheetCard{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:16px;max-height:75vh;overflow:auto}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetHead button{border:0;background:#f1eef2;border-radius:10px;padding:8px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tools button{padding:13px;border:1px solid #e3dce5;background:#fff;border-radius:13px;text-align:left;font-weight:850}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;font:inherit}.hidden{display:none!important}.help{font-size:12px;color:var(--muted);line-height:1.45}.floating{position:fixed;right:12px;bottom:80px;z-index:25;display:flex;gap:6px}.floating button{border:0;background:#fff;box-shadow:0 8px 24px #0002;border-radius:50%;width:42px;height:42px;font-size:17px}@media(min-width:800px){.workspace{padding-bottom:30px}.addbar{position:static;max-width:520px;margin:12px auto;border:1px solid #ddd;border-radius:16px}.floating{position:static;justify-content:center;margin:10px}.sheet{align-items:center;justify-content:center}.sheetCard{max-width:460px;border-radius:22px}}
@media print{.top,.pages,.addbar,.floating{display:none!important}.workspace{padding:0}.page{box-shadow:none;border-radius:0;page-break-after:always;min-height:0}}
</style></head><body>
<header class="top"><button onclick="location.href='generador.html'">←</button><b>Editor de catálogos</b><div><button onclick="undo()">↶</button><button onclick="redo()">↷</button><button class="primary" onclick="window.print()">PDF</button></div></header>
<main class="workspace"><div class="canvasWrap"><div class="pages" id="pages"></div><section id="page" class="page"></section></div></main>
<div class="floating"><button onclick="prev()">‹</button><button id="count">1 / 1</button><button onclick="next()">›</button></div>
<nav class="addbar"><div class="addmenu" id="addmenu"><button onclick="addImage()">🖼️<br>Imagen</button><button onclick="add('producto')">📦<br>Producto</button><button onclick="add('texto')">📝<br>Texto</button><button onclick="add('titulo')">🔤<br>Título</button><button onclick="add('oferta')">🏷️<br>Oferta</button><button onclick="add('beneficios')">⭐<br>Beneficios</button><button onclick="add('whatsapp')">📲<br>WhatsApp</button><button onclick="add('seccion')">▰<br>Sección</button></div><button class="addmain" onclick="toggleAdd()">＋ Añadir elemento</button></nav>
<input id="file" class="hidden" type="file" accept="image/*" multiple onchange="filesChosen(this.files)">
<div class="sheet" id="sheet"><div class="sheetCard"><div class="sheetHead"><h3 id="sheetTitle">Editar elemento</h3><button onclick="closeSheet()">Cerrar</button></div><div id="sheetBody"></div></div></div>
<script>
const photos=['https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=900&q=82','https://images.unsplash.com/photo-1612817288484-6f916006741a?auto=format&fit=crop&w=900&q=82','https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=900&q=82','https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?auto=format&fit=crop&w=900&q=82','https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=900&q=82','https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=900&q=82','https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?auto=format&fit=crop&w=900&q=82','https://images.unsplash.com/photo-1571781926291-c477ebfd024b?auto=format&fit=crop&w=900&q=82'];
const templates=[['suave','Suave y femenino'],['elegante','Elegante y premium'],['editorial','Editorial moderno'],['minimalista','Minimalista'],['boutique','Boutique cálida'],['natural','Natural y fresca'],['juvenil','Juvenil y atrevida'],['clasica','Clásica y refinada']];
let s={theme:'suave',page:0,pages:[{name:'Portada',items:[{type:'cover',title:'Mi catálogo',text:'Productos seleccionados para ti',img:photos[0]}]}]},history=[],future=[],selected=null;
function snap(){history.push(JSON.stringify(s));if(history.length>40)history.shift();future=[]}function undo(){if(!history.length)return;future.push(JSON.stringify(s));s=JSON.parse(history.pop());selected=null;draw()}function redo(){if(!future.length)return;history.push(JSON.stringify(s));s=JSON.parse(future.pop());selected=null;draw()}
function toggleAdd(){document.getElementById('addmenu').classList.toggle('open')}function openSheet(title,body){document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=body;document.getElementById('sheet').classList.add('open')}function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function edit(i){selected=i;const e=s.pages[s.page].items[i];let body='';if(e.type==='image'||e.type==='cover'||e.type==='product')body+=`<button class="tools" style="display:block;width:100%" onclick="pickFor(${i})">🖼️ Cambiar imagen</button>`;if(e.type==='product')body+=`<div class="field"><label>Nombre</label><input id="f1" value="${esc(e.name)}"></div><div class="field"><label>Descripción</label><textarea id="f2">${esc(e.desc)}</textarea></div><div class="field"><label>Precio</label><input id="f3" value="${esc(e.price)}"></div>`;else if(e.type==='cover')body+=`<div class="field"><label>Título</label><input id="f1" value="${esc(e.title)}"></div><div class="field"><label>Texto</label><textarea id="f2">${esc(e.text)}</textarea></div>`;else if(e.type==='title'||e.type==='text'||e.type==='section'||e.type==='benefits'||e.type==='offer'||e.type==='whatsapp')body+=`<div class="field"><label>Texto</label><textarea id="f1">${esc(e.text)}</textarea></div>${e.sub!==undefined?'<div class="field"><label>Texto secundario</label><input id="f2" value="'+esc(e.sub)+'">':''}`;body+=`<button class="addmain" style="margin-top:8px" onclick="saveEdit()">Guardar cambios</button><button class="miniBtn" style="width:100%;margin-top:8px" onclick="removeSelected()">🗑️ Eliminar elemento</button>`;openSheet('Editar elemento',body)}
function saveEdit(){if(selected===null)return;const e=s.pages[s.page].items[selected];snap();if(e.type==='product'){e.name=document.getElementById('f1').value;e.desc=document.getElementById('f2').value;e.price=document.getElementById('f3').value}else if(e.type==='cover'){e.title=document.getElementById('f1').value;e.text=document.getElementById('f2').value}else{e.text=document.getElementById('f1').value;if(document.getElementById('f2'))e.sub=document.getElementById('f2').value}closeSheet();draw()}
function removeSelected(){if(selected===null)return; snap();s.pages[s.page].items.splice(selected,1);selected=null;closeSheet();draw()}
function add(type){snap();const img=photos[s.pages[s.page].items.length%photos.length];const x={type,text:type==='text'?'Escribe aquí la información de tu negocio.':type==='title'?'Nueva colección':type==='section'?'Nueva sección':type==='benefits'?'Calidad · Variedad · Atención personalizada':type==='offer'?'Oferta especial':type==='whatsapp'?'Comprar por WhatsApp':'',img};if(type==='product')Object.assign(x,{name:'Nuevo producto',desc:'Descripción del producto',price:'$0'});s.pages[s.page].items.push(x);selected=s.pages[s.page].items.length-1;draw();edit(selected);document.getElementById('addmenu').classList.remove('open')}
function addImage(){document.getElementById('file').click();document.getElementById('addmenu').classList.remove('open')}function filesChosen(files){[...files].forEach(file=>{const r=new FileReader();r.onload=()=>{snap();s.pages[s.page].items.push({type:'image',img:r.result,text:''});draw()};r.readAsDataURL(file)})}
function pickFor(i){selected=i;document.getElementById('file').dataset.target=i;document.getElementById('file').click()}document.getElementById('file').addEventListener('change',function(){if(this.dataset.target!==undefined&&this.files[0]){const i=+this.dataset.target;const r=new FileReader();r.onload=()=>{snap();s.pages[s.page].items[i].img=r.result;delete this.dataset.target;closeSheet();draw()};r.readAsDataURL(this.files[0])}});
function addPage(){snap();s.pages.push({name:'Nueva página',items:[{type:'title',text:'Nueva página'}]});s.page=s.pages.length-1;draw('turn')}
function duplicate(){snap();s.pages.splice(s.page+1,0,JSON.parse(JSON.stringify(s.pages[s.page])));s.page++;draw('turn')}function delPage(){if(s.pages.length===1)return; snap();s.pages.splice(s.page,1);s.page=Math.max(0,s.page-1);draw()}
function prev(){if(s.page>0){s.page--;draw('turn')}}function next(){if(s.page<s.pages.length-1){s.page++;draw('turn')}}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function itemHtml(e,i){const click=`onclick="edit(${i})"`;if(e.type==='cover')return `<div class="cover block" ${click}><div style="font-size:10px;font-weight:900;letter-spacing:2px">CATÁLOGO DIGITAL</div><h1>${esc(e.title)}</h1><p>${esc(e.text)}</p><img src="${e.img}"></div>`;if(e.type==='image')return `<div class="block" ${click}><img class="photo" src="${e.img}"></div>`;if(e.type==='product')return `<article class="product block" ${click}><img src="${e.img}"><h3>${esc(e.name)}</h3><p>${esc(e.desc)}</p><div class="price">${esc(e.price)}</div></article>`;if(e.type==='offer')return `<div class="offer block" ${click}><h2>${esc(e.text)}</h2><p>${esc(e.sub||'Promoción por tiempo limitado')}</p></div>`;if(e.type==='whatsapp')return `<div class="wa block" ${click}>📲 ${esc(e.text)}</div>`;if(e.type==='title')return `<h2 class="block" ${click}>${esc(e.text)}</h2>`;return `<p class="block" ${click}>${esc(e.text)}</p>`}
function draw(anim){const p=s.pages[s.page],el=document.getElementById('page');el.className='page theme-'+s.theme+(anim?' '+anim:'');el.innerHTML=p.items.map(itemHtml).join('');document.getElementById('count').textContent=`${s.page+1} / ${s.pages.length}`;document.getElementById('pages').innerHTML=s.pages.map((x,i)=>`<button class="thumb ${i===s.page?'active':''}" onclick="s.page=${i};draw()">${i+1}<br>${esc(x.name)}</button>`).join('')}
let sx=0;document.getElementById('page').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.getElementById('page').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)(d<0?next:prev)()},{passive:true});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});draw();
</script></body></html>
