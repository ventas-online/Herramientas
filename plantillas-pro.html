<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CatalogoEdit · Biblioteca Pro</title>
<style>
:root{--bg:#f5f5f7;--ink:#111113;--muted:#6b6b73;--line:#e5e5e8;--card:#fff;--accent:#111}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.wrap{max-width:1500px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{font-weight:950;font-size:22px}.brand span{opacity:.45}.top a{color:var(--ink);text-decoration:none;font-weight:800}.hero{padding:42px 0 24px;display:flex;justify-content:space-between;gap:25px;align-items:end}.hero h1{font-size:clamp(34px,5vw,64px);line-height:.92;letter-spacing:-3px;margin:0 0 14px}.hero p{max-width:680px;color:var(--muted);line-height:1.6;margin:0}.search{width:310px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;outline:none}.filters{display:flex;gap:8px;overflow:auto;padding:4px 0 20px}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;white-space:nowrap;cursor:pointer}.filter.active{background:#111;color:#fff;border-color:#111}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px;cursor:pointer;transition:.22s;box-shadow:0 8px 25px #00000009}.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px #00000016}.card.selected{outline:2px solid #111}.preview{aspect-ratio:3/4;border-radius:14px;overflow:hidden;position:relative}.info{padding:11px 3px 2px}.info strong{font-size:15px}.info small{display:block;color:var(--muted);margin-top:4px}.use{width:100%;border:0;border-radius:10px;padding:10px;margin-top:9px;background:#f1f1f3;font-weight:900;cursor:pointer}.card.selected .use{background:#111;color:#fff}
/* Visual systems */
.p{position:absolute;inset:0;padding:20px}.p .k{font-size:8px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;opacity:.7}.p h2{font-size:27px;line-height:.92;letter-spacing:-1.5px;margin:10px 0}.p .desc{font-size:8px;line-height:1.4;opacity:.7;max-width:82%}.photo{position:absolute;overflow:hidden}.photo div{width:100%;height:100%;background:linear-gradient(135deg,#ddd,#f7f7f7)}.dots{position:absolute;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;left:15px;right:15px;bottom:15px}.dot{height:72px;border-radius:9px;background:#fff8;box-shadow:0 5px 15px #0002}
.editorial{background:#f0ede8;color:#171717}.editorial .photo{left:12px;right:12px;top:12px;height:53%;background:#ddd}.editorial h2{position:absolute;bottom:52px;left:20px;font-size:34px;text-transform:uppercase}.editorial .desc{position:absolute;bottom:27px;left:21px}.monochrome{background:#111;color:#fff}.monochrome .photo{left:18px;right:18px;top:18px;height:52%;background:#333}.monochrome h2{position:absolute;bottom:62px;left:20px;font-size:35px;text-transform:uppercase}.monochrome .dots .dot{background:#252525}.glass{background:linear-gradient(135deg,#dfe8ff,#f8f8ff);color:#111}.glass:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;top:-40px;background:#fff8;filter:blur(2px)}.glass .photo{left:25px;right:25px;top:65px;height:43%;border:1px solid #fff8;box-shadow:0 20px 45px #6b7ea833}.glass h2{margin-top:0}.gridlux{background:#171717;color:#fff}.gridlux .photo{left:14px;right:14px;top:58px;height:45%;background:#333}.gridlux .dots{bottom:15px}.gridlux .dot{background:#272727}.soft{background:#fff4f8;color:#401f2e}.soft .photo{left:20px;right:20px;top:95px;height:38%;border-radius:50% 50% 12px 12px;background:#efd3df}.soft .dots .dot{background:#fff}.korean{background:#f8f5ef;color:#302b28}.korean .photo{left:15px;right:15px;top:14px;height:48%;background:#e6ddd1;border-radius:70px 70px 10px 10px}.korean h2{font-size:30px;margin-top:7px}.street{background:#d8ff32;color:#111}.street .photo{left:0;right:30px;top:0;height:60%;background:#222}.street h2{position:absolute;bottom:55px;left:18px;font-size:36px;text-transform:uppercase}.street .desc{position:absolute;bottom:27px;left:19px}.fashion{background:#f6f4f0;color:#111}.fashion .photo{right:0;top:0;width:62%;height:68%;background:#d9d4ce}.fashion h2{position:absolute;left:18px;bottom:58px;font-size:35px}.fashion .desc{position:absolute;left:19px;bottom:28px}.commerce{background:#fff;color:#111}.commerce .photo{left:14px;right:14px;top:70px;height:45%;background:#eee}.commerce h2{font-size:29px}.commerce .dots{bottom:13px}.commerce .dot{height:60px;background:#f4f4f4}.flash{background:#ff4d00;color:#fff}.flash h2{font-size:38px;text-transform:uppercase}.flash .photo{left:12px;right:12px;top:110px;height:35%;background:#111}.flash .dots .dot{background:#1118}.swiss{background:#fff;color:#111}.swiss:before{content:"";position:absolute;left:15px;top:0;bottom:0;width:8px;background:#111}.swiss h2{font-size:38px}.swiss .photo{left:20px;right:20px;top:145px;height:30%;background:#ddd}.swiss .desc{position:absolute;bottom:22px;left:20px}.natural{background:#e7f0e4;color:#24412c}.natural .photo{left:15px;right:15px;top:92px;height:38%;background:#c6d6c0;border-radius:50% 12px}.natural h2{font-size:30px}.natural .dots .dot{background:#f4f7f1}.darktech{background:#0a0d12;color:#e8f2ff}.darktech .photo{left:14px;right:14px;top:75px;height:45%;background:#17202d;border:1px solid #ffffff18}.darktech h2{font-size:31px}.darktech .dots .dot{background:#17202d;border:1px solid #ffffff18}.food{background:#fff7e8;color:#3c2718}.food .photo{left:14px;right:14px;top:15px;height:49%;background:#e8d1a8;border-radius:12px}.food h2{position:absolute;bottom:62px;left:20px;font-size:31px}.food .desc{position:absolute;bottom:28px;left:21px}.bakery{background:#ead8c5;color:#4b3021}.bakery .photo{left:24px;right:24px;top:45px;height:42%;background:#c8a98b;border-radius:100px 100px 10px 10px}.bakery h2{position:absolute;bottom:45px;left:20px}.beauty{background:linear-gradient(145deg,#f7d5e3,#fff1f6);color:#641c3c}.beauty .photo{right:0;top:0;width:58%;height:47%;background:#e9aeca;border-radius:0 0 0 90px}.beauty h2{position:absolute;bottom:60px;left:20px;font-size:34px}.beauty .desc{position:absolute;bottom:30px;left:21px}.blue{background:#dcecff;color:#102b50}.blue .photo{left:15px;right:15px;top:105px;height:35%;background:#b8d2ee}.blue h2{font-size:31px}.blue .dots .dot{background:#f7fbff}.red{background:#f2e8e8;color:#241314}.red .photo{left:0;right:0;top:0;height:58%;background:#b9a0a0}.red h2{position:absolute;bottom:55px;left:20px;font-size:36px;text-transform:uppercase}.red .desc{position:absolute;bottom:28px;left:21px}.editor{background:#e9e9e9;color:#151515}.editor .photo{left:16px;right:16px;top:16px;height:48%;background:#d0d0d0}.editor h2{position:absolute;bottom:63px;left:20px;font-size:32px}.editor .desc{position:absolute;bottom:32px;left:21px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.wrap{padding:14px}.hero{display:block;padding:28px 0 18px}.search{width:100%;margin-top:18px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{border-radius:15px;padding:7px}.preview{border-radius:10px}.p{padding:12px}.p h2{font-size:22px}.info strong{font-size:13px}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.p h2{font-size:20px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">CatalogoEdit <span>· Biblioteca Pro</span></div><a href="index.html">← Volver a herramientas</a></header>
<section class="hero"><div><h1>Plantillas modernas.<br>Catálogos que venden.</h1><p>Biblioteca visual para producir catálogos profesionales sin depender de APIs. Cada sistema tiene una composición propia, no solo un cambio de color.</p></div><input class="search" id="search" placeholder="Buscar estilo, sector o plantilla…"></section>
<nav class="filters" id="filters"><button class="filter active" data-cat="all">Todas</button><button class="filter" data-cat="beauty">Belleza</button><button class="filter" data-cat="fashion">Moda</button><button class="filter" data-cat="store">Tiendas</button><button class="filter" data-cat="food">Gastronomía</button><button class="filter" data-cat="tech">Tecnología</button><button class="filter" data-cat="premium">Premium</button></nav>
<section class="grid" id="grid"></section>
</main>
<script>
const templates=[
['editorial','Editorial Mono','editorial','fashion premium','Editorial · Moda','fashion'],
['monochrome','Mono Luxe','monochrome','premium beauty','Oscuro · Premium','premium'],
['glass','Glass Modern','glass','store premium','Glass · Contemporáneo','store'],
['gridlux','Luxury Grid','gridlux','premium store','Grid · Lujo','premium'],
['soft','Soft Glam','soft','beauty premium','Suave · Beauty','beauty'],
['korean','Seoul Clean','korean','beauty fashion','K-Beauty · Clean','beauty'],
['street','Street Drop','street','fashion store','Streetwear · Bold','fashion'],
['fashion','Fashion Lookbook','fashion','fashion premium','Lookbook · Editorial','fashion'],
['commerce','Modern Commerce','commerce','store','Tienda · Conversión','store'],
['flash','Flash Drop','flash','store promo','Promoción · Impacto','store'],
['swiss','Swiss Minimal','swiss','store premium','Minimal · Suizo','premium'],
['natural','Natural Market','natural','store beauty','Natural · Orgánico','store'],
['darktech','Dark Tech','darktech','tech store','Tech · Dark','tech'],
['food','Food Editorial','food','food premium','Gastronomía · Editorial','food'],
['bakery','Atelier Bakery','bakery','food','Panadería · Artesanal','food'],
['beauty','Beauty Campaign','beauty','beauty promo','Beauty · Campaña','beauty'],
['blue','Fresh Blue','blue','store tech','Clean · Fresco','store'],
['red','Red Statement','red','fashion promo','Bold · Campaña','fashion'],
['editor','Studio Portfolio','editor','premium fashion','Studio · Portfolio','premium'],
['korean','Skin Lab','korean','beauty','Skincare · Modern','beauty']
];
let cat='all';
const grid=document.getElementById('grid');
function card(t,i){return `<article class="card" data-cat="${t[5]}" data-search="${t[1]} ${t[2]} ${t[3]} ${t[4]}"><div class="preview"><div class="p ${t[2]}"><div class="k">CATALOG · 0${(i%9)+1}</div><h2>${t[1]}</h2><div class="desc">Sistema visual diseñado para producto, marca y conversión.</div><div class="photo"><div></div></div><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div><div class="info"><strong>${t[1]}</strong><small>${t[4]}</small><button class="use">Usar esta plantilla</button></div></article>`}
function render(){let q=document.getElementById('search').value.toLowerCase();let list=templates.filter(t=>(cat==='all'||t[5]===cat)&&(!q||`${t[1]} ${t[2]} ${t[3]} ${t[4]}`.toLowerCase().includes(q)));grid.innerHTML=list.map(card).join('');document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');localStorage.setItem('catalogoTemplate',c.querySelector('strong').textContent)}))}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('search').oninput=render;render();
</script>
</body>
</html>
