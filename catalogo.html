<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo digital | Herramientas IA</title><style>:root{--a:#c83f77;--bg:#fff8fb;--line:#eadfe5;--muted:#766c74}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#241c22}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{display:inline-block;background:#fce8f1;color:#9b315b;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800}.card,.catalog{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;margin:20px 0;box-shadow:0 12px 35px #2d192612}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{font-weight:800;font-size:14px}.fields input{width:100%;margin-top:7px;padding:13px;border:1px solid var(--line);border-radius:12px}.styles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.style{padding:14px;border:1px solid var(--line);border-radius:14px;text-align:center;font-weight:800;cursor:pointer}.selected{outline:3px solid #f0a6c2;background:#fff0f6}button{border:0;border-radius:13px;padding:14px 18px;font-weight:800;cursor:pointer}.primary{background:var(--a);color:#fff;width:100%;margin-top:18px}.cover{text-align:center;padding:55px 20px;border-radius:20px;background:#fff0f6}.cover h1{font-size:44px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.item{border:1px solid var(--line);border-radius:18px;padding:14px}.item img{width:100%;height:230px;object-fit:contain;background:#faf7f9;border-radius:14px}.item h3{margin-bottom:5px}.price{font-size:22px;font-weight:900;color:var(--a)}.wa{display:block;text-align:center;margin-top:12px;padding:11px;background:#f2faf4;color:#267343;text-decoration:none;border-radius:12px;font-weight:800}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1}.muted{color:var(--muted);line-height:1.5}@media(max-width:700px){.fields,.grid{grid-template-columns:1fr}.styles{grid-template-columns:repeat(2,1fr)}.cover h1{font-size:34px}.actions{flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><b>🛠️ Herramientas IA</b><span class="badge">CATÁLOGO DEL CLIENTE</span></div><section class="card"><h1>🛍️ Preparar entrega</h1><p class="muted">Revisa los datos, selecciona el estilo y genera la versión final del catálogo.</p><div class="fields"><label>Negocio<input id="business"></label><label>WhatsApp<input id="whatsapp"></label><label>Instagram<input id="instagram"></label><label>Eslogan<input id="slogan"></label></div><h2>🎨 Estilo</h2><div class="styles"><div class="style selected" data-s="Elegante">✨ Elegante</div><div class="style" data-s="Pastel">🌸 Pastel</div><div class="style" data-s="Minimalista">◻️ Minimalista</div><div class="style" data-s="Premium">💎 Premium</div><div class="style" data-s="Comercial">🛍️ Comercial</div></div><button id="make" class="primary">✨ Generar catálogo final</button></section><section id="catalog" class="catalog" style="display:none"></section></main><script>const data=JSON.parse(localStorage.getItem('catalogoCliente')||'null');let style='Elegante';if(!data){document.getElementById('catalog').style.display='block';document.getElementById('catalog').innerHTML='<h2>No hay un cliente preparado.</h2><p>Vuelve al panel y procesa productos.</p><a href="index.html">← Volver al panel</a>'}else{business.value=data.client.business||'';whatsapp.value=data.client.whatsapp||'';instagram.value=data.client.instagram||'';slogan.value=data.client.slogan||''}document.querySelectorAll('.style').forEach(x=>x.onclick=()=>{document.querySelectorAll('.style').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');style=x.dataset.s});function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('make').onclick=()=>{if(!data)return;const b=business.value.trim()||'Mi tienda';const wa=whatsapp.value.trim().replace(/\D/g,'');const ig=instagram.value.trim();const sloganV=slogan.value.trim();const groups={};data.products.forEach(p=>(groups[p.categoria||'Productos']??=[]).push(p));const cat=document.getElementById('catalog');cat.innerHTML=`<div class="cover"><span class="badge">CATÁLOGO DIGITAL</span><h1>${esc(b)}</h1><p>${esc(sloganV||'Productos seleccionados para ti')}</p><small>Estilo ${esc(style)}</small></div>`;Object.entries(groups).forEach(([name,items])=>{const sec=document.createElement('section');sec.innerHTML=`<h2>${esc(name)}</h2><div class="grid"></div>`;items.forEach(p=>{const msg=encodeURIComponent(`Hola 👋 Estoy interesado/a en ${p.nombre||'este producto'} por $${p.precio||''}. ¿Está disponible?`);const href=wa?`https://wa.me/${wa}?text=${msg}`:'';const el=document.createElement('article');el.className='item';el.innerHTML=`<img src="${p.image||''}" alt=""><h3>${esc(p.nombre||'Producto')}</h3><p class="muted">${esc(p.descripcion||'')}</p><div class="price">$${esc(p.precio||'')}</div>${href?`<a class="wa" target="_blank" href="${href}">📲 Comprar por WhatsApp</a>`:''}`;sec.querySelector('.grid').appendChild(el)});cat.appendChild(sec)});const actions=document.createElement('div');actions.className='actions';actions.innerHTML='<button onclick="window.print()">🖨️ Guardar / PDF</button><button onclick="window.scrollTo({top:0,behavior:\'smooth\'})">⬆️ Revisar</button>';cat.appendChild(actions);cat.style.display='block';cat.scrollIntoView({behavior:'smooth'})};</script></body></html>
