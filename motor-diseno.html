<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motor de diseño · Catálogo IA</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#eeeaf0;color:#211c24}.top{height:58px;background:#fff;border-bottom:1px solid #ddd5df;display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:5}.brand{font-weight:900}.brand b{color:#c43c74}.sp{flex:1}button{border:1px solid #ddd5df;background:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:#c43c74;color:#fff;border:0}.layout{display:grid;grid-template-columns:240px 1fr 260px;min-height:calc(100vh - 58px)}.panel{background:#fff;padding:14px;border-right:1px solid #ddd5df}.right{border-left:1px solid #ddd5df;border-right:0}.title{font-size:12px;font-weight:900;margin:10px 0}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #ddd5df;border-radius:8px;font:inherit}.hint{font-size:11px;line-height:1.5;color:#756c76}.canvasWrap{padding:28px;overflow:auto;display:flex;justify-content:center}.pages{display:grid;gap:30px}.page{width:720px;min-height:900px;background:#fff;box-shadow:0 12px 35px #0002;padding:45px;position:relative;break-after:page}.page.dark{background:#252126;color:#fff}.page.warm{background:#f4e8d7}.page.pastel{background:linear-gradient(#fff7fa,#fff)}.cover{min-height:800px;display:flex;flex-direction:column;justify-content:center;text-align:center}.cover h1{font-size:56px;margin:12px 0}.cover p{font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.grid.three{grid-template-columns:repeat(3,1fr)}.card{border:1px solid #e4dde4;border-radius:15px;padding:10px;overflow:hidden}.dark .card{border-color:#514751}.card img{width:100%;height:230px;object-fit:contain;background:#faf8fa;border-radius:9px}.three .card img{height:155px}.card h3{margin:8px 0 4px;font-size:16px}.price{font-weight:900;color:#c43c74;font-size:19px}.dark .price{color:#ff8db8}.cat{letter-spacing:2px;font-size:11px;font-weight:900;margin-bottom:25px}.status{padding:10px;border-radius:10px;background:#f8f4f7;font-size:12px;margin-bottom:10px}.check{display:flex;gap:7px;align-items:center;font-size:12px;margin:8px 0}@media(max-width:950px){.layout{grid-template-columns:190px 1fr}.right{display:none}.page{width:650px}}@media(max-width:650px){.layout{grid-template-columns:1fr}.panel{display:none}.canvasWrap{padding:8px}.page{width:100%;min-height:650px;padding:25px}.grid,.grid.three{grid-template-columns:1fr}.cover h1{font-size:38px}}</style></head><body><header class="top"><div class="brand">🛍️ Catálogo <b>IA</b></div><button onclick="location.href='editor.html'">Editor</button><button onclick="location.href='index.html'">Productos</button><div class="sp"></div><button onclick="window.print()">Exportar PDF</button></header><div class="layout"><aside class="panel"><div class="title">✨ MOTOR DE DISEÑO</div><div class="status" id="status">Analizando productos...</div><button class="primary" style="width:100%" onclick="autoDesign()">✨ Diseñar automáticamente</button><div class="title">ESTRUCTURA</div><div class="field"><label>PRODUCTOS POR PÁGINA</label><select id="per"><option value="4">4 — destacado</option><option value="6" selected>6 — equilibrado</option><option value="9">9 — compacto</option></select></div><div class="field"><label>ESTILO</label><select id="theme"><option value="pastel">🌸 Pastel Beauty</option><option value="dark">🖤 Luxury</option><option value="clean">🤍 Minimal</option><option value="warm">🛍️ Comercial</option></select></div><div class="field"><label>DENSIDAD</label><select id="density"><option value="large">Fotos grandes</option><option value="balanced" selected>Equilibrado</option><option value="compact">Más productos</option></select></div><p class="hint">El motor crea portada + páginas de productos automáticamente. No necesitas calcular páginas manualmente.</p></aside><main class="canvasWrap"><div id="pages" class="pages"></div></main><aside class="panel right"><div class="title">PREVISUALIZACIÓN</div><div id="summary" class="status"></div><div class="title">REGLAS DEL CATÁLOGO</div><label class="check"><input id="showPrice" type="checkbox" checked> Mostrar precio</label><label class="check"><input id="showDesc" type="checkbox" checked> Mostrar descripción</label><label class="check"><input id="whatsapp" type="checkbox" checked> Botón WhatsApp</label><button style="width:100%;margin-top:12px" onclick="location.href='editor.html'">✏️ Abrir editor visual</button></aside></div><script>const data=JSON.parse(localStorage.getItem('catalogoCliente')||'null')||{};const products=data.products||[];const business=data.client?.business||'Mi negocio';const slogan=data.client?.slogan||'Catálogo digital';const pagesEl=document.getElementById('pages');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function chunks(a,n){let r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r}function autoDesign(){const n=Number(document.getElementById('per').value);const theme=document.getElementById('theme').value;const groups=chunks(products,n);pagesEl.innerHTML=`<section class="page ${theme} cover"><div class="cat">CATÁLOGO DIGITAL</div><h1>${esc(business)}</h1><p>${esc(slogan)}</p><p style="margin-top:35px;font-weight:800">${products.length} productos</p></section>`;groups.forEach((group,i)=>{const page=document.createElement('section');page.className='page '+theme;page.innerHTML=`<div class="cat">${esc(group[0]?.categoria||'PRODUCTOS')}</div><div class="grid ${n>=9?'three':''}">${group.map(p=>`<article class="card"><img src="${esc(p.image||'')}" alt=""><h3>${esc(p.nombre||'Producto')}</h3>${document.getElementById('showPrice').checked?`<div class="price">${esc(p.precio||p.price||'Consultar')}</div>`:''}${document.getElementById('showDesc').checked?`<p>${esc(p.descripcion||'')}</p>`:''}${document.getElementById('whatsapp').checked?`<button style="width:100%;margin-top:6px">Comprar por WhatsApp</button>`:''}</article>`).join('')}</div><div style="position:absolute;bottom:25px;font-size:10px;opacity:.6">Página ${i+2}</div>`;pagesEl.appendChild(page)});document.getElementById('summary').textContent=`${products.length} productos · ${groups.length+1} páginas · ${n} productos/página`;document.getElementById('status').textContent=products.length?`✓ ${products.length} productos listos para diseñar`:'No hay productos. Procesa imágenes primero.'}['per','theme','density','showPrice','showDesc','whatsapp'].forEach(id=>document.getElementById(id).addEventListener('change',autoDesign));autoDesign();</script></body></html>
