<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA para productos</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f3f6;color:#211d22}.app{max-width:1100px;margin:auto;padding:20px}.cab,.panel,.producto{background:#fff;border:1px solid #e3dde4;border-radius:18px;padding:18px}.cab{margin-bottom:16px}.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.producto img{width:100%;height:210px;object-fit:contain;background:#f4f1f4;border-radius:12px}.campo{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:9px;margin:5px 0 10px}.etiqueta{font-size:12px;font-weight:900}.boton{border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer;background:#c83f77;color:#fff}.boton.sec{background:#fff;color:#211d22;border:1px solid #ddd}.estado{padding:12px;background:#faf7fa;border-radius:10px;font-size:13px}.precio{font-size:20px;font-weight:900}.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}</style></head><body><main class="app"><section class="cab"><h1>🤖 Analizador de productos con IA</h1><p>Sube fotografías y prepara automáticamente la ficha comercial. <b>El precio siempre lo confirma el operador.</b></p><div class="acciones"><input id="archivos" type="file" accept="image/*" multiple onchange="cargar(event)"><button class="boton" onclick="analizar()">✨ Analizar productos</button></div><div id="estado" class="estado">Esperando fotografías...</div></section><section id="lista" class="rejilla"></section></main><script>let productos=[];function cargar(e){productos=[...e.target.files].map((f,i)=>({file:f,nombre:'Producto '+(i+1),marca:'Por identificar',categoria:'Por identificar',beneficios:'Por generar',descripcion:'Pendiente de análisis',precio:'',url:URL.createObjectURL(f)}));render();estado.textContent=productos.length+' fotografías cargadas. Pulsa «Analizar productos».'}function analizar(){if(!productos.length){estado.textContent='Primero selecciona al menos una fotografía.';return}productos.forEach((p,i)=>{p.nombre='Producto '+(i+1);p.marca='Marca por confirmar';p.categoria='Categoría por confirmar';p.beneficios='Beneficios por generar con IA';p.descripcion='Descripción comercial pendiente de conexión con el modelo de IA.'});estado.textContent='✅ Fichas preparadas. En la siguiente integración se enviarán las imágenes al modelo de IA para identificar y redactar la información.';render();guardar()}function render(){lista.innerHTML=productos.map((p,i)=>`<article class="producto"><img src="${p.url}"><label class="etiqueta">Nombre</label><input class="campo" value="${esc(p.nombre)}" oninput="productos[${i}].nombre=this.value"><label class="etiqueta">Marca</label><input class="campo" value="${esc(p.marca)}" oninput="productos[${i}].marca=this.value"><label class="etiqueta">Categoría</label><input class="campo" value="${esc(p.categoria)}" oninput="productos[${i}].categoria=this.value"><label class="etiqueta">Beneficios</label><textarea class="campo" rows="3" oninput="productos[${i}].beneficios=this.value">${esc(p.beneficios)}</textarea><label class="etiqueta">Descripción</label><textarea class="campo" rows="4" oninput="productos[${i}].descripcion=this.value">${esc(p.descripcion)}</textarea><label class="etiqueta">Precio</label><input class="campo precio" placeholder="Ejemplo: $12.99" value="${esc(p.precio)}" oninput="productos[${i}].precio=this.value"><button class="boton sec" onclick="productos.splice(${i},1);render();guardar()">🗑️ Quitar producto</button></article>`).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function guardar(){localStorage.setItem('productosIA',JSON.stringify(productos.map(({file,...p})=>p)))} </script></body></html>
