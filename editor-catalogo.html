<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de Catálogos</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f2eff4;color:#19161d}*{box-sizing:border-box}button{cursor:pointer;font:inherit}.barra{height:64px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5}.marca{font-weight:900}.marca b{color:#c43d74}.acciones{display:flex;gap:6px}.boton{border:1px solid #ddd;background:white;border-radius:9px;padding:9px 12px;font-weight:800}.principal{background:#19161d;color:white}.zona{display:grid;grid-template-columns:260px 1fr 260px;min-height:calc(100vh - 64px)}aside{background:#fff;padding:14px;overflow:auto}.izq{border-right:1px solid #ddd}.der{border-left:1px solid #ddd}.titulo{font-size:11px;text-transform:uppercase;font-weight:900;color:#756d78;margin:7px 0}.botones{display:grid;grid-template-columns:1fr 1fr;gap:7px}.herramienta{border:1px solid #e2dce4;background:#fff;border-radius:11px;padding:12px 5px;font-weight:800;font-size:11px}.herramienta:hover{border-color:#c43d74}.disenos{display:grid;grid-template-columns:1fr 1fr;gap:7px}.diseno{border:2px solid #ddd;padding:4px;background:#fff;border-radius:11px;text-align:left}.diseno.activo{border-color:#c43d74}.diseno img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:7px}.diseno b{font-size:10px;display:block;padding:4px}.lienzo{background:#d8d4da;padding:24px;display:flex;justify-content:center;overflow:auto}.libro{width:min(760px,100%)}.paginas{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.mini{min-width:52px;height:68px;border:2px solid #ddd;background:white;border-radius:6px;font-size:9px;text-align:center;padding-top:22px}.mini.activa{border-color:#c43d74}.pagina{background:white;min-height:920px;padding:35px;box-shadow:0 18px 50px #0002;transition:.35s;transform-origin:left center}.pagina.giro{animation:giro .45s}@keyframes giro{from{transform:rotateY(-10deg);opacity:.3}to{transform:rotateY(0);opacity:1}}.pastel{background:linear-gradient(#fff0f6,#fff)}.elegante{background:#1d171c;color:white}.editorial{background:#f0e9e0}.minimalista{background:#fff}.boutique{background:#fff4ec}.natural{background:#eafff7}.juvenil{background:#17151c;color:white}.clasica{background:#f1e8d8}.portada{min-height:300px;border-radius:20px;padding:30px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;margin-bottom:25px}.pastel .portada{background:#ffb7d1}.elegante .portada{background:#2c2027}.editorial .portada{background:#ded2c4}.minimalista .portada{background:#f3f2f6}.boutique .portada{background:#e9c8b5}.natural .portada{background:#bce8d7}.juvenil .portada{background:#532d59}.clasica .portada{background:#dfd0ba}.foto-portada{position:absolute;right:0;top:0;width:45%;height:100%;overflow:hidden;border-radius:0 0 0 90px}.foto-portada img{width:100%;height:100%;object-fit:cover}.portada h1{font-size:45px;line-height:.92;max-width:55%;margin:10px 0}.portada p{max-width:48%;font-size:12px}.seccion{margin:24px 0}.productos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.producto{background:white;color:#222;border:1px solid #e5e0e5;border-radius:14px;padding:8px}.producto img{width:100%;height:200px;object-fit:cover;border-radius:9px}.producto h3{font-size:14px}.producto p{font-size:10px;color:#777}.precio{font-size:17px;font-weight:900;color:#c43d74}.elemento{border:1px solid #e4dfe5;padding:9px;border-radius:9px;margin:6px 0;display:flex;justify-content:space-between;font-size:11px}.elemento button{border:0;background:#ffe9f1;color:#a32f5e;border-radius:6px;padding:4px}.editable:focus{outline:2px solid #c43d74;background:#ffffff33}.ayuda{font-size:11px;background:#faf7fa;padding:9px;border-radius:9px;line-height:1.5}.pagina-nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#19161d;color:white;border-radius:30px;padding:7px 10px;display:flex;gap:8px;align-items:center}.pagina-nav button{border:0;border-radius:50%;width:34px;height:34px;background:#ffffff18;color:white}.campo{margin:9px 0}.campo label{font-size:10px;font-weight:900}.campo input{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;margin-top:4px}@media(max-width:950px){.zona{grid-template-columns:210px 1fr}.der{position:fixed;right:0;top:64px;bottom:0;width:280px;z-index:4;transform:translateX(100%);transition:.2s}.der.abierto{transform:none}}@media(max-width:650px){.zona{display:block}.izq{display:none}.lienzo{padding:8px}.pagina{min-height:720px;padding:18px}.productos{grid-template-columns:1fr}.portada h1{font-size:34px}.portada{min-height:240px}.foto-portada{width:42%}}@media print{.barra,aside,.paginas,.pagina-nav{display:none!important}.zona{display:block}.lienzo{padding:0;background:white}.pagina{box-shadow:none;page-break-after:always;min-height:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><header class="barra"><div class="marca">🛍️ Catálogo <b>Pro</b></div><div class="acciones"><button class="boton" onclick="deshacer()">↶ Deshacer</button><button class="boton" onclick="rehacer()">↷ Rehacer</button><button class="boton" onclick="nuevaPagina()">＋ Página</button><button class="boton principal" onclick="window.print()">📄 PDF</button><button class="boton" onclick="document.querySelector('.der').classList.toggle('abierto')">⚙️ Editar</button></div></header><div class="zona"><aside class="izq"><div class="titulo">Elementos</div><div class="botones"><button class="herramienta" onclick="agregar('titulo')">🔤<br>Título</button><button class="herramienta" onclick="agregar('texto')">📝<br>Texto</button><button class="herramienta" onclick="agregar('producto')">📦<br>Producto</button><button class="herramienta" onclick="agregar('imagen')">🖼️<br>Imagen</button><button class="herramienta" onclick="agregar('oferta')">🏷️<br>Oferta</button><button class="herramienta" onclick="agregar('beneficios')">⭐<br>Beneficios</button><button class="herramienta" onclick="agregar('whatsapp')">📲<br>WhatsApp</button><button class="herramienta" onclick="agregar('seccion')">📚<br>Sección</button></div><p class="ayuda">Selecciona cualquier elemento. Aparecerá en la página y podrás editar su texto directamente. Las plantillas también son editables.</p><div class="titulo">Plantillas</div><div class="disenos" id="disenos"></div></aside><main class="lienzo"><div class="libro"><div class="paginas" id="paginas"></div><div class="pagina pastel" id="pagina"></div></div></main><aside class="der"><div class="titulo">Página actual</div><div class="campo"><label>Nombre</label><input id="nombrePagina" oninput="nombre(this.value)"></div><div class="titulo">Elementos</div><div id="lista"></div><button class="boton" style="width:100%;margin-top:8px" onclick="duplicar()">📄 Duplicar página</button><button class="boton" style="width:100%;margin-top:8px" onclick="eliminarPagina()">🗑️ Eliminar página</button><button class="boton principal" style="width:100%;margin-top:8px" onclick="window.print()">📄 Guardar PDF</button></aside></div><div class="pagina-nav"><button onclick="anterior()">‹</button><span id="contador">1 / 1</span><button onclick="siguiente()">›</button></div><script>
const plantillas=[['pastel','Suave y femenino','https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=700&q=80'],['elegante','Elegante y premium','https://images.unsplash.com/photo-1612817288484-6f916006741a?auto=format&fit=crop&w=700&q=80'],['editorial','Editorial moderno','https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=700&q=80'],['minimalista','Minimalista','https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?auto=format&fit=crop&w=700&q=80'],['boutique','Boutique cálida','https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=700&q=80'],['natural','Natural y fresca','https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=700&q=80'],['juvenil','Juvenil y atrevida','https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?auto=format&fit=crop&w=700&q=80'],['clasica','Clásica y refinada','https://images.unsplash.com/photo-1571781926291-c477ebfd024b?auto=format&fit=crop&w=700&q=80']];
let estado={tema:'pastel',pagina:0,paginas:[{nombre:'Portada',elementos:[{tipo:'portada',titulo:'Mi catálogo',sub:'Productos seleccionados para ti'}]}]};let atras=[],adelante=[];function guardar(){atras.push(JSON.stringify(estado));if(atras.length>30)atras.shift();adelante=[]}function deshacer(){if(!atras.length)return;adelante.push(JSON.stringify(estado));estado=JSON.parse(atras.pop());dibujar()}function rehacer(){if(!adelante.length)return;atras.push(JSON.stringify(estado));estado=JSON.parse(adelante.pop());dibujar()}
function escapar(v){return String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function plantilla(){document.getElementById('disenos').innerHTML=plantillas.map(p=>`<button class="diseno ${estado.tema===p[0]?'activo':''}" onclick="aplicar('${p[0]}')"><img src="${p[2]}"><b>${p[1]}</b></button>`).join('')}function aplicar(t){guardar();estado.tema=t;dibujar('giro')}
function agregar(tipo){guardar();const img=plantillas.find(p=>p[0]===estado.tema)[2];const m={titulo:{tipo:'titulo',texto:'Nueva colección'},texto:{tipo:'texto',texto:'Escribe aquí la información para tus clientes.'},producto:{tipo:'producto',nombre:'Nuevo producto',precio:'Consultar',descripcion:'Descripción del producto',img},imagen:{tipo:'imagen',img},oferta:{tipo:'oferta',texto:'OFERTA ESPECIAL',sub:'Promoción por tiempo limitado'},beneficios:{tipo:'beneficios',texto:'Calidad · Variedad · Atención personalizada'},whatsapp:{tipo:'whatsapp',texto:'Comprar por WhatsApp'},seccion:{tipo:'seccion',texto:'Nueva sección'}};estado.paginas[estado.pagina].elementos.push(m[tipo]);dibujar()}
function nuevaPagina(){guardar();estado.paginas.push({nombre:'Nueva página',elementos:[{tipo:'titulo',texto:'Nueva página'}]});estado.pagina=estado.paginas.length-1;dibujar('giro')}function duplicar(){guardar();const copia=JSON.parse(JSON.stringify(estado.paginas[estado.pagina]));estado.paginas.splice(estado.pagina+1,0,copia);estado.pagina++;dibujar('giro')}function eliminarPagina(){if(estado.paginas.length===1)return alert('Debe existir al menos una página.');guardar();estado.paginas.splice(estado.pagina,1);estado.pagina=Math.max(0,estado.pagina-1);dibujar()}
function anterior(){if(estado.pagina>0){estado.pagina--;dibujar('giro')}}function siguiente(){if(estado.pagina<estado.paginas.length-1){estado.pagina++;dibujar('giro')}}function nombre(v){guardar();estado.paginas[estado.pagina].nombre=v;dibujar(false)}function cambiar(i,k,v){guardar();estado.paginas[estado.pagina].elementos[i][k]=v;dibujar(false)}function quitar(i){guardar();estado.paginas[estado.pagina].elementos.splice(i,1);dibujar()}
function htmlElemento(e,i){if(e.tipo==='portada')return `<div class="portada"><div style="font-size:9px;letter-spacing:2px;font-weight:900">CATÁLOGO DIGITAL</div><h1 class="editable" contenteditable onblur="cambiar(${i},'titulo',this.innerText)">${escapar(e.titulo)}</h1><p class="editable" contenteditable onblur="cambiar(${i},'sub',this.innerText)">${escapar(e.sub)}</p><div class="foto-portada"><img src="${plantillas.find(p=>p[0]===estado.tema)[2]}"></div></div>`;if(e.tipo==='titulo')return `<div class="seccion"><h2 class="editable" contenteditable onblur="cambiar(${i},'texto',this.innerText)">${escapar(e.texto)}</h2></div>`;if(e.tipo==='texto'||e.tipo==='seccion'||e.tipo==='beneficios')return `<div class="seccion"><p class="editable" contenteditable onblur="cambiar(${i},'texto',this.innerText)">${escapar(e.texto)}</p></div>`;if(e.tipo==='imagen')return `<div class="seccion"><img src="${e.img}" style="width:100%;max-height:380px;object-fit:cover;border-radius:15px"></div>`;if(e.tipo==='oferta')return `<div class="seccion" style="background:#c43d74;color:white;padding:25px;border-radius:16px"><h2 class="editable" contenteditable onblur="cambiar(${i},'texto',this.innerText)">${escapar(e.texto)}</h2><p class="editable" contenteditable onblur="cambiar(${i},'sub',this.innerText)">${escapar(e.sub)}</p></div>`;if(e.tipo==='whatsapp')return `<div class="seccion"><div style="background:#eaf8ef;color:#247448;padding:12px;text-align:center;border-radius:10px;font-weight:900" class="editable" contenteditable onblur="cambiar(${i},'texto',this.innerText)">📲 ${escapar(e.texto)}</div></div>`;if(e.tipo==='producto')return `<div class="seccion"><div class="productos"><article class="producto"><img src="${e.img}"><h3 class="editable" contenteditable onblur="cambiar(${i},'nombre',this.innerText)">${escapar(e.nombre)}</h3><p class="editable" contenteditable onblur="cambiar(${i},'descripcion',this.innerText)">${escapar(e.descripcion)}</p><div class="precio editable" contenteditable onblur="cambiar(${i},'precio',this.innerText)">${escapar(e.precio)}</div></article></div></div>`;return ''}
function dibujar(anim){plantilla();const p=estado.paginas[estado.pagina];const pagina=document.getElementById('pagina');pagina.className='pagina '+estado.tema+(anim?' '+anim:'');pagina.innerHTML=p.elementos.map(htmlElemento).join('');document.getElementById('nombrePagina').value=p.nombre;document.getElementById('contador').textContent=`${estado.pagina+1} / ${estado.paginas.length}`;document.getElementById('paginas').innerHTML=estado.paginas.map((x,i)=>`<button class="mini ${i===estado.pagina?'activa':''}" onclick="estado.pagina=${i};dibujar()">${i+1}<br>${escapar(x.nombre)}</button>`).join('');document.getElementById('lista').innerHTML=p.elementos.map((e,i)=>`<div class="elemento"><span>${i+1}. ${e.tipo}</span><button onclick="quitar(${i})">Quitar</button></div>`).join('')}
let inicioX=0;document.getElementById('pagina').addEventListener('touchstart',e=>inicioX=e.touches[0].clientX,{passive:true});document.getElementById('pagina').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-inicioX;if(Math.abs(d)>55)(d<0?siguiente:anterior)()},{passive:true});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();deshacer()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();rehacer()}});dibujar();</script></body></html>
