<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CatalogoEdit — Editor profesional</title>
<style>
:root{--ink:#16151a;--muted:#77727c;--line:#e8e5ea;--panel:#fff;--canvas:#eef0f3;--accent:#111;--radius:16px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f8;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:68px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:50}.brand{font-weight:900;letter-spacing:-.03em}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}.top-actions{display:flex;gap:7px;align-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:800;color:var(--ink)}.btn:hover{border-color:#b9b5bc}.btn.dark{background:#111;color:#fff;border-color:#111}.btn.icon{padding:10px}.workspace{display:grid;grid-template-columns:250px minmax(420px,1fr) 290px;min-height:calc(100vh - 68px)}.panel{background:#fff;padding:15px;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.11em;color:#85808a;margin:4px 0 10px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 8px;text-align:left;font-weight:850;font-size:11px}.tool:hover{transform:translateY(-1px);box-shadow:0 7px 20px #0000000b}.templates{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tpl{border:1px solid var(--line);background:#fff;border-radius:12px;padding:5px;text-align:left}.tpl.active{outline:2px solid #111}.tpl img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block}.tpl b{display:block;font-size:10px;padding:6px 3px 3px}.hint{font-size:11px;line-height:1.5;background:#f7f7f8;border-radius:12px;padding:11px;color:#5e5962;margin:12px 0}.stage{background:var(--canvas);padding:28px;overflow:auto;display:flex;justify-content:center}.book{width:min(780px,100%)}.pages{display:flex;gap:7px;overflow:auto;padding:2px 0 10px}.thumb{min-width:62px;height:72px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:9px;text-align:center}.thumb.active{border:2px solid #111}.page{position:relative;width:100%;min-height:980px;background:#fff;padding:42px;box-shadow:0 24px 70px #00000016;border-radius:4px;overflow:hidden}.page.dark{background:#121214;color:#fff}.page.warm{background:#f5eee5}.page.soft{background:#f8f3f5}.page.blue{background:#edf2f5}.page .dropzone{min-height:890px;position:relative}.canvas-element{position:absolute;left:40px;top:40px;min-width:60px;max-width:calc(100% - 80px);touch-action:none;cursor:move;user-select:none}.canvas-element.selected{outline:2px solid #111;outline-offset:5px}.canvas-element .handle{position:absolute;right:-8px;top:-8px;width:16px;height:16px;background:#111;border-radius:50%;display:none}.canvas-element.selected .handle{display:block}.text-el{font-size:34px;font-weight:900;letter-spacing:-.045em;line-height:1.02}.body-el{font-size:16px;line-height:1.5;max-width:500px}.product-el{width:280px;background:#fff;color:#17151a;border:1px solid #e7e4e8;border-radius:18px;padding:10px;box-shadow:0 14px 35px #0000000c}.product-el img{width:100%;height:220px;object-fit:cover;border-radius:12px;background:#f2f2f2}.product-el h3{margin:10px 2px 4px;font-size:17px}.product-el p{margin:0 2px 7px;color:#777;font-size:12px;line-height:1.45}.price{font-size:19px;font-weight:950;margin:0 2px}.img-el{width:330px}.img-el img{width:100%;max-height:430px;object-fit:cover;border-radius:16px;display:block}.offer{background:#111;color:#fff;border-radius:18px;padding:22px 25px;width:420px}.wa{background:#eaf7ef;color:#17643b;border-radius:14px;padding:13px 18px;font-weight:900;width:270px;text-align:center}.cover{inset:40px;position:absolute;border-radius:26px;overflow:hidden;background:linear-gradient(135deg,#ece8e3,#fff);padding:45px;display:flex;flex-direction:column;justify-content:center}.cover.dark{background:linear-gradient(135deg,#161619,#34343a);color:#fff}.cover h1{font-size:64px;line-height:.9;letter-spacing:-.06em;margin:10px 0;max-width:62%}.cover p{max-width:50%;font-size:14px}.cover .cover-img{position:absolute;right:0;top:0;width:48%;height:100%;object-fit:cover;clip-path:polygon(20% 0,100% 0,100% 100%,0 100%)}.empty{height:100%;min-height:700px;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;border:1px dashed #ccc;border-radius:20px}.field{margin:10px 0}.field label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#777}.field input,.field textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#111}.selected-title{font-size:12px;font-weight:900;margin:15px 0 8px}.layers{display:grid;gap:6px}.layer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;border:1px solid var(--line);border-radius:10px;font-size:11px}.layer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.danger{color:#a21e32;background:#fff0f2;border:0;border-radius:8px;padding:5px 7px}.upload{display:block;width:100%;padding:10px;border:1px dashed #aaa;border-radius:10px;text-align:center;font-weight:800;font-size:11px;background:#fafafa;cursor:pointer}.upload input{display:none}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:11px 16px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1050px){.workspace{grid-template-columns:220px minmax(400px,1fr)}.right{position:fixed;right:0;top:68px;bottom:0;width:300px;z-index:40;transform:translateX(100%);transition:.25s;box-shadow:-20px 0 50px #00000014}.right.open{transform:none}.stage{padding:18px}}
@media(max-width:700px){.top{height:auto;min-height:62px;padding:9px 10px}.top-actions .optional{display:none}.workspace{display:block}.left{display:none}.stage{padding:8px}.page{min-height:760px;padding:20px}.dropzone{min-height:720px!important}.cover{inset:20px;padding:25px}.cover h1{font-size:42px}.canvas-element{left:25px;max-width:calc(100% - 50px)}.right{top:62px;width:min(310px,92vw)}.product-el{width:240px}.img-el{width:260px}.offer{width:280px}}
@media print{.top,.panel,.pages{display:none!important}.workspace{display:block}.stage{padding:0;background:#fff}.page{box-shadow:none;border-radius:0;page-break-after:always;min-height:0}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">CatalogoEdit <small>Editor profesional</small></div>
  <div class="top-actions">
    <button class="btn optional" onclick="undo()">↶</button><button class="btn optional" onclick="redo()">↷</button>
    <button class="btn optional" onclick="newPage()">＋ Página</button>
    <button class="btn" onclick="window.location.href='plantillas-modernas.html'">Plantillas</button>
    <button class="btn dark" onclick="window.print()">Exportar PDF</button>
  </div>
</header>
<div class="workspace">
<aside class="panel left">
  <div class="label">Añadir al lienzo</div>
  <div class="tools">
    <button class="tool" onclick="addText('title')">T Título</button>
    <button class="tool" onclick="addText('body')">Aa Texto</button>
    <button class="tool" onclick="addProduct()">▣ Producto</button>
    <button class="tool" onclick="addImage()">▧ Imagen</button>
    <button class="tool" onclick="addOffer()">% Oferta</button>
    <button class="tool" onclick="addWhatsApp()">↗ WhatsApp</button>
  </div>
  <div class="hint"><b>Ahora sí:</b> cada elemento añadido es independiente. Puedes tocarlo y <b>arrastrarlo libremente</b> por la página. En Producto e Imagen puedes cargar tus propias fotos.</div>
  <div class="label">Estilos rápidos</div>
  <div class="templates" id="templates"></div>
</aside>
<main class="stage">
  <div class="book">
    <div class="pages" id="pages"></div>
    <div class="page" id="page"><div class="dropzone" id="dropzone"></div></div>
  </div>
</main>
<aside class="panel right" id="rightPanel">
  <div class="label">Propiedades</div>
  <div id="properties"><div class="hint">Selecciona un elemento para editarlo.</div></div>
  <div class="selected-title">Capas de esta página</div>
  <div class="layers" id="layers"></div>
  <button class="btn" style="width:100%;margin-top:10px" onclick="duplicatePage()">Duplicar página</button>
  <button class="btn" style="width:100%;margin-top:8px" onclick="deletePage()">Eliminar página</button>
</aside>
</div>
</div>
<div class="toast" id="toast"></div>
<input id="fileInput" type="file" accept="image/*" hidden>
<script>
const styles={
 editorial:{name:'Editorial',class:'',cover:'https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=1000&q=85'},
 noir:{name:'Noir Luxe',class:'dark',cover:'https://images.unsplash.com/photo-1612817288484-6f916006741a?auto=format&fit=crop&w=1000&q=85'},
 warm:{name:'Warm Studio',class:'warm',cover:'https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=1000&q=85'},
 soft:{name:'Soft Beauty',class:'soft',cover:'https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=1000&q=85'},
 blue:{name:'Cool Commerce',class:'blue',cover:'https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?auto=format&fit=crop&w=1000&q=85'}
};
let state={style:'editorial',page:0,pages:[{name:'Portada',elements:[{id:id(),type:'cover',x:40,y:40,title:'Tu marca',subtitle:'Nueva colección',image:styles.editorial.cover}]}]};
let history=[],future=[],selected=null,drag=null,pendingFileMode=null;
function id(){return Math.random().toString(36).slice(2,10)}
function current(){return state.pages[state.page]}
function snapshot(){history.push(JSON.stringify(state));if(history.length>40)history.shift();future=[]}
function undo(){if(!history.length)return;future.push(JSON.stringify(state));state=JSON.parse(history.pop());selected=null;render()}
function redo(){if(!future.length)return;history.push(JSON.stringify(state));state=JSON.parse(future.pop());selected=null;render()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTemplates(){document.getElementById('templates').innerHTML=Object.entries(styles).map(([key,s])=>`<button class="tpl ${state.style===key?'active':''}" onclick="applyStyle('${key}')"><img src="${s.cover}"><b>${s.name}</b></button>`).join('')}
function applyStyle(key){snapshot();state.style=key;current().elements.forEach(e=>{if(e.type==='cover'){e.image=styles[key].cover;e.dark=styles[key].class==='dark'}});render();toast('Estilo aplicado')}
function addText(kind){snapshot();const e={id:id(),type:kind==='title'?'title':'body',x:60,y:180,text:kind==='title'?'Nueva colección':'Escribe aquí la información de tu producto o marca.'};current().elements.push(e);selected=e.id;render()}
function addProduct(){snapshot();const e={id:id(),type:'product',x:60,y:300,name:'Nuevo producto',description:'Descripción del producto',price:'$0',image:''};current().elements.push(e);selected=e.id;render();openUpload(e.id,'product')}
function addImage(){snapshot();const e={id:id(),type:'image',x:60,y:300,image:''};current().elements.push(e);selected=e.id;render();openUpload(e.id,'image')}
function addOffer(){snapshot();const e={id:id(),type:'offer',x:60,y:480,title:'OFERTA ESPECIAL',text:'Promoción por tiempo limitado'};current().elements.push(e);selected=e.id;render()}
function addWhatsApp(){snapshot();const e={id:id(),type:'whatsapp',x:60,y:620,text:'Comprar por WhatsApp'};current().elements.push(e);selected=e.id;render()}
function newPage(){snapshot();state.pages.push({name:'Nueva página',elements:[{id:id(),type:'title',x:60,y:80,text:'Nueva página'}]});state.page=state.pages.length-1;selected=null;render()}
function duplicatePage(){snapshot();const p=JSON.parse(JSON.stringify(current()));p.name=p.name+' copia';p.elements.forEach(e=>e.id=id());state.pages.splice(state.page+1,0,p);state.page++;selected=null;render()}
function deletePage(){if(state.pages.length===1)return toast('Debe quedar al menos una página');snapshot();state.pages.splice(state.page,1);state.page=Math.max(0,state.page-1);selected=null;render()}
function openUpload(id,mode){pendingFileMode={id,mode};document.getElementById('fileInput').click()}
document.getElementById('fileInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file||!pendingFileMode)return;const r=new FileReader();r.onload=()=>{snapshot();const el=current().elements.find(x=>x.id===pendingFileMode.id);if(el)el.image=r.result;render();toast('Imagen cargada correctamente')};r.readAsDataURL(file);e.target.value=''});
function setProp(key,value){const e=current().elements.find(x=>x.id===selected);if(!e)return;snapshot();e[key]=value;render()}
function deleteElement(idv){snapshot();current().elements=current().elements.filter(e=>e.id!==idv);if(selected===idv)selected=null;render()}
function select(idv){selected=idv;renderPropertiesOnly()}
function render(){renderTemplates();const p=current();const page=document.getElementById('page');const s=styles[state.style];page.className='page '+s.class;document.getElementById('pages').innerHTML=state.pages.map((x,i)=>`<button class="thumb ${i===state.page?'active':''}" onclick="state.page=${i};selected=null;render()">${i+1}<br>${esc(x.name)}</button>`).join('');const zone=document.getElementById('dropzone');zone.innerHTML=p.elements.length?p.elements.map(elementHTML).join(''):`<div class="empty">Añade un elemento desde la izquierda</div>`;document.getElementById('layers').innerHTML=p.elements.map((e,i)=>`<div class="layer"><span onclick="select('${e.id}')">${i+1}. ${esc(label(e))}</span><button class="danger" onclick="deleteElement('${e.id}')">×</button></div>`).join('');renderPropertiesOnly();bindDrag();}
function label(e){return e.type==='title'?'Título':e.type==='body'?'Texto':e.type==='product'?'Producto':e.type==='image'?'Imagen':e.type==='offer'?'Oferta':e.type==='whatsapp'?'WhatsApp':'Portada'}
function elementHTML(e){const sel=selected===e.id?' selected':'';const pos=`left:${e.x}px;top:${e.y}px;z-index:${e.z||1}`;if(e.type==='cover')return `<div class="canvas-element${sel}" data-id="${e.id}" style="${pos};left:0;top:0;max-width:none;width:100%;height:100%"><div class="cover ${e.dark?'dark':''}"><img class="cover-img" src="${e.image||styles[state.style].cover}"><div style="font-size:10px;font-weight:900;letter-spacing:.16em">CATÁLOGO DIGITAL</div><h1>${esc(e.title)}</h1><p>${esc(e.subtitle)}</p></div></div>`;if(e.type==='title')return `<div class="canvas-element text-el${sel}" data-id="${e.id}" style="${pos}" contenteditable="true" onblur="saveInline('${e.id}','text',this.innerText)">${esc(e.text)}</div>`;if(e.type==='body')return `<div class="canvas-element body-el${sel}" data-id="${e.id}" style="${pos}" contenteditable="true" onblur="saveInline('${e.id}','text',this.innerText)">${esc(e.text)}</div>`;if(e.type==='product')return `<div class="canvas-element product-el${sel}" data-id="${e.id}" style="${pos}"><img src="${e.image||'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27600%27 height=%27400%27%3E%3Crect width=%27600%27 height=%27400%27 fill=%27%23f1f1f1%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 text-anchor=%27middle%27 dominant-baseline=%27middle%27 font-family=%27Arial%27 font-size=%2724%27 fill=%27%23999%27%3ESube una imagen%3C/text%3E%3C/svg%3E'}" onclick="select('${e.id}')"><h3>${esc(e.name)}</h3><p>${esc(e.description)}</p><div class="price">${esc(e.price)}</div></div>`;if(e.type==='image')return `<div class="canvas-element img-el${sel}" data-id="${e.id}" style="${pos}"><img src="${e.image||'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27600%27 height=%27400%27%3E%3Crect width=%27600%27 height=%27400%27 fill=%27%23f1f1f1%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 text-anchor=%27middle%27 dominant-baseline=%27middle%27 font-family=%27Arial%27 font-size=%2724%27 fill=%27%23999%27%3ESelecciona una imagen%3C/text%3E%3C/svg%3E'}" onclick="select('${e.id}')"></div>`;if(e.type==='offer')return `<div class="canvas-element offer${sel}" data-id="${e.id}" style="${pos}"><b>${esc(e.title)}</b><div style="margin-top:7px;font-size:13px">${esc(e.text)}</div></div>`;if(e.type==='whatsapp')return `<div class="canvas-element wa${sel}" data-id="${e.id}" style="${pos}">↗ ${esc(e.text)}</div>`;return ''}
function saveInline(idv,key,value){const e=current().elements.find(x=>x.id===idv);if(e){snapshot();e[key]=value;}}
function renderPropertiesOnly(){const box=document.getElementById('properties');const e=current().elements.find(x=>x.id===selected);if(!e){box.innerHTML='<div class="hint">Selecciona un elemento para editarlo. También puedes arrastrarlo directamente en la página.</div>';return}let html=`<div class="hint"><b>${label(e)}</b><br>Arrastra el elemento con el mouse o con el dedo.</div>`;if(e.type==='title'||e.type==='body')html+=`<div class="field"><label>Texto</label><textarea oninput="quickProp('text',this.value)">${esc(e.text)}</textarea></div>`;if(e.type==='product')html+=`<div class="field"><label>Nombre</label><input value="${esc(e.name)}" oninput="quickProp('name',this.value)"></div><div class="field"><label>Descripción</label><textarea oninput="quickProp('description',this.value)">${esc(e.description)}</textarea></div><div class="field"><label>Precio</label><input value="${esc(e.price)}" oninput="quickProp('price',this.value)"></div><label class="upload">📷 ${e.image?'Cambiar imagen':'Añadir imagen'}<input type="file" accept="image/*" onchange="uploadDirect('${e.id}',this.files[0])"></label>`;if(e.type==='image')html+=`<label class="upload">📷 ${e.image?'Cambiar imagen':'Añadir imagen'}<input type="file" accept="image/*" onchange="uploadDirect('${e.id}',this.files[0])"></label>`;if(e.type==='offer')html+=`<div class="field"><label>Título</label><input value="${esc(e.title)}" oninput="quickProp('title',this.value)"></div><div class="field"><label>Texto</label><textarea oninput="quickProp('text',this.value)">${esc(e.text)}</textarea></div>`;if(e.type==='whatsapp')html+=`<div class="field"><label>Texto</label><input value="${esc(e.text)}" oninput="quickProp('text',this.value)"></div>`;html+=`<button class="btn" style="width:100%;margin-top:10px" onclick="duplicateElement('${e.id}')">Duplicar elemento</button><button class="btn" style="width:100%;margin-top:8px;color:#a21e32" onclick="deleteElement('${e.id}')">Eliminar elemento</button>`;box.innerHTML=html}
let propTimer;function quickProp(k,v){clearTimeout(propTimer);propTimer=setTimeout(()=>{const e=current().elements.find(x=>x.id===selected);if(e)e[k]=v;render();},120)}
function uploadDirect(idv,file){if(!file)return;const r=new FileReader();r.onload=()=>{snapshot();const e=current().elements.find(x=>x.id===idv);if(e)e.image=r.result;render();toast('Imagen actualizada')};r.readAsDataURL(file)}
function duplicateElement(idv){const e=current().elements.find(x=>x.id===idv);if(!e)return;snapshot();const c=JSON.parse(JSON.stringify(e));c.id=id();c.x+=25;c.y+=25;current().elements.push(c);selected=c.id;render()}
function bindDrag(){document.querySelectorAll('.canvas-element').forEach(el=>{el.onpointerdown=startDrag});}
function startDrag(ev){if(ev.target.closest('input,textarea,button'))return;const idv=this.dataset.id;const e=current().elements.find(x=>x.id===idv);if(!e||e.type==='cover')return;selected=idv;this.setPointerCapture(ev.pointerId);drag={id:idv,startX:ev.clientX,startY:ev.clientY,origX:e.x,origY:e.y,moved:false};this.onpointermove=moveDrag;this.onpointerup=endDrag;this.onpointercancel=endDrag;renderPropertiesOnly();this.classList.add('selected');}
function moveDrag(ev){if(!drag)return;const e=current().elements.find(x=>x.id===drag.id);const zone=document.getElementById('dropzone');const scale=zone.getBoundingClientRect().width/780;e.x=Math.max(0,Math.min(zone.clientWidth-50,drag.origX+(ev.clientX-drag.startX)/Math.max(scale,.01)));e.y=Math.max(0,Math.min(zone.clientHeight-50,drag.origY+(ev.clientY-drag.startY)/Math.max(scale,.01)));drag.moved=true;this.style.left=e.x+'px';this.style.top=e.y+'px';}
function endDrag(){if(!drag)return;if(drag.moved){history.push(JSON.stringify(state));if(history.length>40)history.shift();future=[]}drag=null;this.onpointermove=null;this.onpointerup=null;}
document.addEventListener('click',e=>{if(e.target.closest('.right'))document.getElementById('rightPanel').classList.add('open')});
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),1600)}
render();
</script>
</body>
</html>
